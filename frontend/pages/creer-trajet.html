<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un trajet – EcoRideNova</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="logo">🌿 EcoRideNova</div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <nav class="nav" id="mainNav">
      <a href="../index.html">Accueil</a>
      <a href="covoiturages.html">Covoiturages</a>
      <a href="dashboard.html">Mon espace</a>
      <a href="connexion.html">Déconnexion</a>
    </nav>
  </header>

  <!-- FORMULAIRE CRÉATION DE TRAJET -->
  <section class="create-ride">
    <h2>🚗 Proposer un nouveau trajet</h2>
    <form class="ride-form" id="createRideForm">
      <label for="departure">Ville de départ :</label>
      <input type="text" id="departure" placeholder="Ex : Paris" required>

      <label for="arrival">Ville d’arrivée :</label>
      <input type="text" id="arrival" placeholder="Ex : Lyon" required>

      <label for="date">Date de départ :</label>
      <input type="date" id="date" required>

      <label for="time">Heure de départ :</label>
      <input type="time" id="time" required>

      <label for="price">Prix (€) :</label>
      <input type="number" id="price" min="0" placeholder="Ex : 25" required>

      <label for="seats">Places disponibles :</label>
      <input type="number" id="seats" min="1" max="5" required>

      <label for="preferences">Préférences :</label>
      <textarea id="preferences" rows="3" placeholder="Non-fumeur, musique calme, etc."></textarea>

      <button type="submit" class="btn btn-primary">Créer le trajet</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 EcoRideNova – contact@ecoride.fr</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
