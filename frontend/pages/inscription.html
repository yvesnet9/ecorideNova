<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription – EcoRideNova</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="logo">🌿 EcoRideNova</div>
    <nav class="nav">
      <a href="../index.html">Accueil</a>
      <a href="covoiturages.html">Covoiturages</a>
      <a href="connexion.html">Connexion</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="auth-section">
    <h2>🧍 Créer un compte</h2>
    <form class="auth-form">
      <label>Nom complet :</label>
      <input type="text" placeholder="Marie Dupont" required>

      <label>Email :</label>
      <input type="email" placeholder="exemple@mail.com" required>

      <label>Mot de passe :</label>
      <input type="password" placeholder="********" required>

      <button type="submit" class="btn btn-primary">S’inscrire</button>
      <p>Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
    </form>
  </section>

  <footer class="footer">
    <p>© 2025 EcoRideNova – contact@ecoride.fr</p>
  </footer>

</body>
</html>
